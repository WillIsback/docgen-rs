name: Release
on:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install OpenSSL (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Install cross
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        env:
          OPENSSL_VENDORED: "1"
          OPENSSL_STATIC: "1"
        run: cross build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/docgen docgen-${{ matrix.platform }}
      - uses: softprops/action-gh-release@v2
        with:
          files: docgen-${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            target: aarch64-apple-darwin
          - platform: macos-amd64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          OPENSSL_VENDORED: "1"
        run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/docgen docgen-${{ matrix.platform }}
      - uses: softprops/action-gh-release@v2
        with:
          files: docgen-${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          RUSTFLAGS: "-C link-arg=advapi32.lib"
        run: cargo build --release
      - run: cp target/release/docgen.exe docgen-windows-amd64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: docgen-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
